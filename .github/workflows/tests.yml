name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m ni_power_forecast generate-demo --days 120 --output data/demo/ci_demo.csv
      - run: python -m ni_power_forecast backtest --input data/demo/ci_demo.csv --output-dir outputs/ci
